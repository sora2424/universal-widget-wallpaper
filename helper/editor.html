<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>万能ウィジェット壁紙 — 設定ノート</title>
<style>
:root{
  --ink:#141116; --paper:#1c181d; --paper2:#231e24; --rule:rgba(239,233,228,.08); --rule2:rgba(239,233,228,.16);
  --t1:#efe9e4; --t2:#b4aba5; --t3:#7d746f;
  --acc:#ff9b85; --acc-ink:#2a1410; --acc-soft:rgba(255,155,133,.14);
  --note:#efe3c4; --note-ink:#3a3122;
  --serif:"Yu Mincho","YuMincho","Noto Serif JP","Hiragino Mincho ProN",serif;
  --sans:"BIZ UDPGothic","Yu Gothic UI","Meiryo UI","Noto Sans JP",sans-serif;
  --mono:"Cascadia Mono","Consolas","Menlo",monospace;
  --ease:cubic-bezier(.22,.9,.24,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);color:var(--t1);font:15px/1.65 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
::selection{background:var(--acc);color:var(--acc-ink)}
::-webkit-scrollbar{width:12px} ::-webkit-scrollbar-thumb{background:rgba(239,233,228,.12);border:4px solid var(--ink);border-radius:8px}

.app{display:grid;grid-template-columns:270px minmax(0,1fr) 440px;grid-template-rows:72px 1fr;height:100vh}

/* ---------- header ---------- */
header{grid-column:1/-1;display:flex;align-items:center;gap:18px;padding:0 26px;border-bottom:1px solid var(--rule)}
.mark{display:flex;align-items:baseline;gap:12px;white-space:nowrap}
.mark b{font:600 22px/1 var(--serif);letter-spacing:.06em}
.mark b em{font-style:normal;color:var(--acc);margin-left:.1em}
.mark span{font:11px var(--mono);letter-spacing:.28em;color:var(--t3);text-transform:uppercase}
.conn{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--t2);padding-left:18px;border-left:1px solid var(--rule)}
.conn i{width:7px;height:7px;border-radius:50%;background:var(--t3)}
.conn.ok i{background:#9fdcb4} .conn.saving i{background:var(--acc)} .conn.err i{background:#ff6b6b}
.find{margin-left:auto;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--rule2);padding:4px 2px;width:300px}
.find svg{width:15px;height:15px;stroke:var(--t3);fill:none;stroke-width:2;flex-shrink:0}
.find input{flex:1;border:0;background:none;outline:none;padding:4px 0}
.find input::placeholder{color:var(--t3)}
.tool{border:0;background:none;color:var(--t2);cursor:pointer;padding:6px 4px;font-size:13.5px;border-bottom:1px solid transparent;white-space:nowrap}
.tool:hover{color:var(--t1);border-bottom-color:var(--t2)}
.tool.warn:hover{color:#ffb4a6;border-bottom-color:#ffb4a6}
.scrsel{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--t3);padding-left:18px;border-left:1px solid var(--rule)}
.scrsel .tool.on{color:var(--acc);border-bottom-color:var(--acc)}

/* ---------- index (left) ---------- */
nav{border-right:1px solid var(--rule);overflow:auto;padding:22px 0 40px}
.ix-h{font:11px var(--mono);letter-spacing:.3em;color:var(--t3);padding:0 26px;margin:20px 0 8px}
.ix-h:first-child{margin-top:0}
.ix{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:6px;width:100%;padding:9px 22px 9px 26px;border:0;background:none;text-align:left;cursor:pointer;color:var(--t2);position:relative}
.ix:hover{color:var(--t1);background:rgba(239,233,228,.03)}
.ix .no{font:12px var(--mono);color:var(--t3)}
.ix .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ix.active{color:var(--t1)}
.ix.active::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;background:var(--acc)}
.ix.active .no{color:var(--acc)}
.ix .tag{font:10.5px var(--mono);letter-spacing:.08em;padding:2px 7px;border:1px solid var(--rule2);border-radius:4px;color:var(--t3);cursor:pointer}
.ix .tag.on{border-color:var(--acc);color:var(--acc)}
.ix.off .nm{color:var(--t3)}

/* ---------- page (center) ---------- */
main{overflow:auto;position:relative;
  background:repeating-linear-gradient(180deg,transparent 0 35px,rgba(239,233,228,.022) 35px 36px)}
.page{max-width:820px;padding:34px 48px 120px 64px;position:relative}
.page::before{content:"";position:absolute;left:40px;top:0;bottom:0;width:1px;background:rgba(255,155,133,.18)}
.p-no{font:12px var(--mono);letter-spacing:.3em;color:var(--acc)}
.p-h{display:flex;align-items:center;gap:16px;margin:4px 0 6px}
.p-h h1{margin:0;font:600 32px/1.25 var(--serif);letter-spacing:.04em}
.p-h .ico{width:30px;height:30px;stroke:var(--t2);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.p-h .onoff{margin-left:auto}
.p-d{color:var(--t2);margin:0 0 26px;font-size:14px}
.grp{margin:0 0 30px}
.grp-t{font:12px var(--mono);letter-spacing:.24em;color:var(--t3);margin:0 0 4px;display:flex;align-items:center;gap:12px}
.grp-t::after{content:"";flex:1;height:1px;background:var(--rule)}
.it{display:flex;align-items:center;gap:20px;padding:13px 0;border-bottom:1px dashed var(--rule)}
.it:last-child{border-bottom:0}
.it.sub{padding-left:22px;position:relative}
.it.sub::before{content:"";position:absolute;left:4px;top:0;height:50%;width:10px;border-left:1px solid var(--rule2);border-bottom:1px solid var(--rule2)}
.it.sub2{padding-left:44px}
.it.sub2::before{left:26px}
.lb{flex:1;min-width:0}
.lb .n{display:flex;align-items:center;gap:10px}
.lb .d{display:block;font-size:12.5px;color:var(--t3);margin-top:2px;line-height:1.5}
.ed{font:10px var(--mono);letter-spacing:.1em;color:var(--acc);border:1px solid rgba(255,155,133,.4);border-radius:3px;padding:0 5px;line-height:16px}
.ct{display:flex;align-items:center;gap:10px;flex-shrink:0}
.back{border:0;background:none;color:var(--t3);cursor:pointer;font-size:12px;padding:4px 6px;visibility:hidden;border-radius:4px}
.back.on{visibility:visible} .back:hover{color:var(--t1);background:rgba(239,233,228,.06)}
.memo{background:var(--note);color:var(--note-ink);padding:12px 16px 12px 18px;font-size:13.5px;line-height:1.7;margin:0 0 24px;border-radius:2px;
  box-shadow:0 10px 24px rgba(0,0,0,.35);position:relative}
.memo::before{content:"";position:absolute;left:50%;top:-8px;width:70px;height:16px;margin-left:-35px;background:rgba(239,233,228,.35);transform:rotate(-2deg)}
.it .memo{margin:6px 0;flex:1;box-shadow:none;background:rgba(239,227,196,.1);color:var(--t2)}
.it .memo::before{display:none}

/* controls */
.sw{position:relative;width:58px;height:28px;border:1px solid var(--rule2);border-radius:6px;background:transparent;cursor:pointer;padding:0;flex-shrink:0;transition:border-color .2s,background .2s}
.sw::before{content:"OFF";position:absolute;right:8px;top:0;line-height:26px;font:10.5px/26px var(--mono);letter-spacing:.08em;color:var(--t3)}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:4px;background:var(--t3);transition:transform .28s var(--ease),background .2s}
.sw.on{border-color:var(--acc);background:var(--acc-soft)}
.sw.on::before{content:"ON";left:9px;right:auto;color:var(--acc)}
.sw.on::after{transform:translateX(30px);background:var(--acc)}
.sw.sm{width:46px;height:22px} .sw.sm::before{font-size:9px;line-height:20px;right:6px} .sw.sm::after{width:14px;height:14px} .sw.sm.on::after{transform:translateX(24px)} .sw.sm.on::before{left:6px}
.rg{display:flex;align-items:center;gap:14px}
.rg input[type=range]{-webkit-appearance:none;appearance:none;width:210px;height:20px;background:none;cursor:pointer;outline:none}
.rg input[type=range]::-webkit-slider-runnable-track{height:2px;background:linear-gradient(90deg,var(--acc) var(--p,50%),var(--rule2) var(--p,50%))}
.rg input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;margin-top:-5.5px;background:var(--t1);transform:rotate(45deg);border-radius:2px;box-shadow:0 0 0 4px var(--ink)}
.rg input[type=range]:hover::-webkit-slider-thumb{background:var(--acc)}
.rg .v{width:58px;border:0;border-bottom:1px solid var(--rule2);background:none;text-align:right;font:14px var(--mono);outline:none;padding:2px 0}
.rg .v:focus{border-bottom-color:var(--acc)}
.tabs{display:inline-flex;gap:2px;flex-wrap:wrap;justify-content:flex-end}
.tabs button{border:1px solid var(--rule2);background:none;padding:5px 13px;cursor:pointer;color:var(--t2);font-size:13.5px;margin-left:-1px;white-space:nowrap}
.tabs button:first-child{border-radius:6px 0 0 6px} .tabs button:last-child{border-radius:0 6px 6px 0}
.tabs button:hover{color:var(--t1)}
.tabs button.on{background:var(--t1);color:var(--ink);border-color:var(--t1);position:relative;z-index:1}
select{height:36px;min-width:220px;max-width:320px;border:1px solid var(--rule2);border-radius:6px;background:var(--paper);padding:0 34px 0 12px;outline:none;cursor:pointer;
  -webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--t2) 50%),linear-gradient(135deg,var(--t2) 50%,transparent 50%);
  background-position:calc(100% - 17px) 16px,calc(100% - 12px) 16px;background-size:5px 5px;background-repeat:no-repeat}
select:hover,select:focus{border-color:var(--t2)}
.tx{width:300px;height:36px;border:1px solid var(--rule2);border-radius:6px;background:rgba(0,0,0,.2);padding:0 12px;outline:none}
.tx:focus{border-color:var(--acc)}
.tx.w{width:360px}
.btn{height:36px;padding:0 14px;border:1px solid var(--rule2);border-radius:6px;background:none;cursor:pointer;white-space:nowrap;color:var(--t2)}
.btn:hover{border-color:var(--t1);color:var(--t1)}
.cl{width:44px;height:32px;border:1px solid var(--rule2);border-radius:6px;padding:3px;background:none;cursor:pointer}
.cl::-webkit-color-swatch-wrapper{padding:0} .cl::-webkit-color-swatch{border:0;border-radius:3px}

textarea.tx.area{height:auto;width:360px;padding:10px 12px;resize:vertical;line-height:1.7;font-family:var(--serif)}
/* todo list editor */
.it[data-key="todo_items"]{flex-direction:column;align-items:stretch;gap:10px}
.it[data-key="todo_items"] .ct{justify-content:flex-start}
.todo-ed{display:grid;gap:8px;width:100%}
.te-row{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center}
.te-row .tx{width:100%}
.te-no{font:12px var(--mono);color:var(--t3)}
.te-row.add .te-no{color:var(--acc)}

/* shortcut cards */
.cards{display:grid;gap:12px;margin:10px 0 0}
.cd{display:grid;grid-template-columns:52px 1fr;gap:8px 14px;padding:14px 16px;border:1px solid var(--rule);border-radius:8px;background:rgba(28,24,29,.85)}
.cd .num{grid-row:span 4;align-self:start;font:600 22px/1 var(--serif);color:var(--t3);padding-top:6px}
.cd .num small{display:block;font:10px var(--mono);letter-spacing:.2em;margin-top:6px}
.cd .f{display:flex;gap:8px;align-items:center}
.cd .f > .tx,.cd .f > select{flex:1;width:auto;min-width:0;max-width:none}
.cd.hidden{display:none}

/* photos (samples) */
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:4px 0 30px}
.photos button{border:0;padding:8px 8px 10px;background:#ece6df;cursor:pointer;text-align:left;border-radius:2px;box-shadow:0 8px 20px rgba(0,0,0,.35);transition:transform .3s var(--ease)}
.photos button:nth-child(odd){transform:rotate(-.8deg)} .photos button:nth-child(even){transform:rotate(.7deg)}
.photos button:hover{transform:rotate(0) translateY(-3px)}
.photos .img{aspect-ratio:16/9;background:#333 center/cover}
.photos span{display:block;font:12.5px var(--serif);color:#3a332e;margin-top:7px}
.photos button.on{outline:2px solid var(--acc);outline-offset:3px}

/* preview (right) */
aside{border-left:1px solid var(--rule);padding:26px 26px 40px;overflow:auto}
.pv-t{display:flex;justify-content:space-between;align-items:center;font:11px var(--mono);letter-spacing:.3em;color:var(--t3);margin-bottom:14px}
.frame{background:#ece6df;padding:10px 10px 34px;border-radius:2px;box-shadow:0 18px 40px rgba(0,0,0,.45);transform:rotate(-.6deg);position:relative}
.frame .scr{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:#000}
.frame iframe{position:absolute;left:0;top:0;width:1920px;height:1080px;border:0;transform-origin:0 0;pointer-events:none}
.frame figcaption{position:absolute;left:12px;bottom:8px;font:13px var(--serif);color:#3a332e}
.frame figcaption small{font:10px var(--mono);letter-spacing:.2em;color:#8a7f76;margin-left:8px}
.notes{margin-top:30px;display:grid;gap:16px}
.notes .memo{margin:0;font-size:13px}
.notes .memo:nth-child(2){transform:rotate(.6deg)}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);padding:10px 18px;background:var(--t1);color:var(--ink);border-radius:4px;opacity:0;transition:all .3s var(--ease);pointer-events:none;z-index:99;font-size:14px}
.toast.show{opacity:1;transform:translate(-50%,0)}
.offline{position:fixed;inset:72px 0 0;display:none;place-items:center;background:rgba(20,17,22,.92);z-index:50}
.offline.show{display:grid}
.offline .memo{max-width:460px;transform:rotate(-1deg)}
@media (max-width:1300px){ .app{grid-template-columns:230px 1fr} aside{display:none} }
</style>
</head>

  <header>
    <div class="mark"><b>万能ウィジェット<em>壁紙</em></b><span>settings notebook</span></div>

    <div class="scrsel" id="scrSel" style="display:none"></div>

    <a class="tool" id="bGit" target="_blank" rel="noopener noreferrer" style="text-decoration:none;display:none">GitHub ↗</a>
    <button class="tool" id="bReset">位置をリセット</button>
    <button class="tool" id="bExport">書き出し</button>

    <button class="tool warn" id="bClear">すべて元に戻す</button>

  <nav id="nav"></nav>
  <main id="main"><div class="page" id="page"></div></main>
  <aside>

    <figure class="frame" id="frame" style="margin:0"><div class="scr" id="scr"><iframe id="pvFrame" title="preview"></iframe></div><figcaption>いまの壁紙<small>LIVE</small></figcaption></figure>
    <div class="notes">
      <div class="memo">変えたらすぐ壁紙に反映されます（約1秒）。保存ボタンはありません。</div>
      <div class="memo">ここで変えた項目には <b>編集</b> の印が付き、Wallpaper Engine 側の設定より優先されます。「戻す」で元どおり。</div>
      <div class="memo">ウィジェットの位置は、壁紙の上でドラッグして決めてください。</div>
    </div>
  </aside>
</div>

<div class="toast" id="toast"></div>

const svg=k=>`<svg class="ico" viewBox="0 0 24 24">${ICO[k]||ICO.h_basic}</svg>`;

/* ---------------- helpers ---------------- */
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('show'),2200); }
function conn(cls,txt){ const c=$('conn'); c.className='conn '+cls; c.lastChild.textContent=txt; }
function clean(t){ return String(t||'').replace(/^[\s　]*(└\s*)?/,'').replace(/^#\d+\s*/,'').replace(/^[^\w\s\u3000-\u9fff\uff00-\uffef]+\s*/,'').trim(); }
function depth(t){ const m=String(t||'').match(/^[　]+/); return m?m[0].length:0; }
const eff=k=>k in values?values[k]:(defs[k]?defs[k].value:undefined);
function ok(c){ if(!c) return true; try{ const ctx={}; for(const k in defs) ctx[k]={value:eff(k)}; return !!(new Function('c','with(c){return ('+c+')}'))(ctx); }catch(e){ return true; } }
const toHex=s=>'#'+String(s||'1 1 1').split(' ').map(x=>Math.round(Math.max(0,Math.min(1,parseFloat(x)||0))*255).toString(16).padStart(2,'0')).join('');
const fromHex=h=>[1,3,5].map(i=>(parseInt(h.substr(i,2),16)/255).toFixed(3)).join(' ');

/* ---------------- load ---------------- */
async function load(){
  try{
    H['X-Uww-Token']=await fetch('/token',{cache:'no-store'}).then(r=>{ if(!r.ok) throw 0; return r.text(); });
    await Promise.all([loadScreens(),loadFontList()]);
    const [s,c]=await Promise.all([fetch('/files/project.json',{cache:'no-store'}).then(r=>r.json()), fetch('/config'+iq(),{headers:H,cache:'no-store'}).then(r=>r.json())]);
    values=isObj(c&&c.values)?c.values:{};
    const props=s.general.properties;
    schema=Object.keys(props).filter(k=>k!=='schemecolor').map(k=>({key:k,...props[k]})).sort((a,b)=>a.order-b.order);
    schema.forEach(p=>defs[p.key]=p);
    build(); nav(); open(location.hash.slice(1)||sections[0].id); conn('ok','ヘルパー接続中');
    $('pvFrame').src=pvSrc(); fit();
  }catch(e){ $('off').classList.add('show'); conn('err','未接続'); }
}

/* ---------------- fonts ---------------- */
// the font list lives in the wallpaper's schema.js (window.UWW_FONTS=…); it is read as data, never run
let FONTS={};
const isFontKey=k=>k==='font_text'||k==='font_num'||k==='wordsfont';
async function loadFontList(){
  try{ const t=await fetch('/files/schema.js',{cache:'no-store'}).then(r=>r.ok?r.text():'');
    const m=t.match(/window\.UWW_FONTS=(\{[\s\S]*?\});\s*$/); const j=m?JSON.parse(m[1]):{};
    if(isObj(j)) for(const id in j) if(/^[a-z0-9]{1,24}$/.test(id)&&isObj(j[id])&&typeof j[id].css==='string'&&/^[\w\s",.\-]+$/.test(j[id].css)) FONTS[id]={css:j[id].css};
  }catch(e){}
}
let fontsAsked=false;
function loadInstalledFonts(){ if(fontsAsked) return; fontsAsked=true;
  fetch('/fonts',{headers:H,cache:'no-store'}).then(r=>r.ok?r.json():[]).then(a=>{ if(!Array.isArray(a)) return;
    const dl=document.getElementById('fontList')||document.body.appendChild(Object.assign(document.createElement('datalist'),{id:'fontList'}));
    dl.innerHTML=''; a.slice(0,2000).forEach(n=>{ if(typeof n==='string'){ const o=document.createElement('option'); o.value=n; dl.appendChild(o); } }); }).catch(()=>{ fontsAsked=false; });
}

/* ---------------- screens (the wallpaper on each display keeps its own settings) ---------------- */
const isObj=o=>!!o&&typeof o==='object'&&!Array.isArray(o);
let INST=(location.search.match(/[?&]inst=([a-f0-9]{8,32})(?:&|$)/)||[])[1]||'', screens=[];
const TH_NAME={crystal:'翠晶の庭',azure:'蒼薔薇の水底',hakuyou:'白曜駅',violet:'紫刃の鬼姫',neon:'月下のネオン都市',standard:'スタンダード'};
const iq=()=>INST?'?inst='+INST:'';
const pvSrc=()=>'/files/index.html?preview=1'+(INST?'&inst='+INST:'');
const scrName=s=>'画面'+(screens.indexOf(s)+1)+(TH_NAME[s.th]?'（'+TH_NAME[s.th]+'）':'');
async function loadScreens(){
  try{ screens=await fetch('/screens',{headers:H,cache:'no-store'}).then(r=>r.ok?r.json():[]); }catch(e){ screens=[]; }
  if(!Array.isArray(screens)) screens=[];
  if(!screens.some(s=>s.id===INST)){ const a=screens.filter(s=>s.active); INST=((a[0]||screens[0])||{}).id||INST; }
  drawScreens();
}
function drawScreens(){
  const box=$('scrSel'), list=screens.filter(s=>s.active||s.id===INST);
  if(list.length<2){ box.style.display='none'; box.innerHTML=''; return; }
  box.style.display=''; box.innerHTML='<span>編集する画面</span>'+list.map(s=>`<button class="tool${s.id===INST?' on':''}" data-id="${esc(s.id)}">${esc(scrName(s))}</button>`).join('');
  box.querySelectorAll('button').forEach(b=>b.onclick=()=>switchScreen(b.dataset.id));
}
async function switchScreen(id){
  if(id===INST) return; await flushSave();
  try{ const c=await fetch('/config?inst='+id,{headers:H,cache:'no-store'}).then(r=>{ if(!r.ok) throw 0; return r.json(); });
    INST=id; values=isObj(c.values)?c.values:{}; history.replaceState(null,'','?inst='+id+location.hash);
    drawScreens(); nav(); open(current); if($('pvToggle').classList.contains('on')) $('pvFrame').src=pvSrc();
    const s=screens.find(x=>x.id===id); toast((s?scrName(s):'この画面')+' の設定に切り替えました');
  }catch(e){ toast('切り替えられませんでした'); }
}
setInterval(()=>{ if(H['X-Uww-Token']!=='1') fetch('/screens',{headers:H,cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{ if(Array.isArray(j)&&JSON.stringify(j.map(s=>[s.id,s.th,s.active]))!==JSON.stringify(screens.map(s=>[s.id,s.th,s.active]))){ screens=j; drawScreens(); } }).catch(()=>{}); },5000);
function build(){
  sections=[]; let cur=null, inW=false;
  for(const p of schema){
    if(p.key.startsWith('h_')){ inW=p.key==='h_widgets'; if(!inW){ cur={id:p.key,title:clean(p.text.replace(/━/g,'')),items:[],group:'GENERAL'}; sections.push(cur); } continue; }
    if(inW&&p.key.startsWith('show_')){ cur={id:p.key,title:clean(p.text).replace(/（.*?）/g,'').trim(),full:clean(p.text),toggle:p.key,items:[],group:'WIDGETS'}; sections.push(cur); continue; }
    if(inW&&p.key==='n_widgets') continue;
    if(cur) cur.items.push(p);
  }
  sections.forEach((s,i)=>s.no=String(i+1).padStart(2,'0'));
}
function nav(){
  const n=$('nav'); n.innerHTML=''; let g='';
  for(const s of sections){
    if(s.group!==g){ g=s.group; n.insertAdjacentHTML('beforeend',`<div class="ix-h">${g==='GENERAL'?'全体の設定':'ウィジェット'}</div>`); }
    const b=document.createElement('button'); b.className='ix'+(s.id===current?' active':''); b.dataset.id=s.id;
    b.innerHTML=`<span class="no">${s.no}</span><span class="nm">${esc(s.title)}</span>`;
    if(s.toggle){ const on=!!eff(s.toggle); b.classList.toggle('off',!on);
      const t=document.createElement('span'); t.className='tag'+(on?' on':''); t.textContent=on?'ON':'OFF'; t.title='クリックで表示 / 非表示';
      t.onclick=e=>{ e.stopPropagation(); set(s.toggle,!eff(s.toggle)); nav(); if(current===s.id) open(current); }; b.appendChild(t); }
    else b.appendChild(document.createElement('span'));
    b.onclick=()=>open(s.id); n.appendChild(b);
  }
}

/* ---------------- page ---------------- */
function open(id){
  const s=sections.find(x=>x.id===id)||sections[0]; current=s.id; history.replaceState(null,'','#'+s.id);
  document.querySelectorAll('.ix').forEach(b=>b.classList.toggle('active',b.dataset.id===s.id));
  const pg=$('page'); pg.innerHTML=''; $('main').scrollTop=0;
  pg.insertAdjacentHTML('beforeend',`<div class="p-no">${s.no} / ${String(sections.length).padStart(2,'0')}</div>`);
  const h=document.createElement('div'); h.className='p-h'; h.innerHTML=`${svg(s.id)}<h1>${esc(s.title)}</h1>`;
  if(s.toggle){ const sw=swEl(s.toggle,()=>{ nav(); open(s.id); }); sw.classList.add('onoff'); h.appendChild(sw); }
  pg.appendChild(h);
  const d=document.createElement('p'); d.className='p-d';
  d.textContent=s.toggle?(eff(s.toggle)?'表示中です。下で細かく調整できます。':'いまは非表示です。右上のスイッチで表示できます。')+(s.full&&/要ヘルパー/.test(s.full)?'（操作ヘルパーが必要です）':''):
    ({h_basic:'動きのなめらかさや、編集ボタンなど全体にかかわる設定。',h_theme:'テーマを選ぶと、ウィジェットのデザインと「テーマの背景」が切り替わります。機能はどれも同じです。',h_bg:'背景にする絵と、その上にかける効果。',h_look:'アクセント色やカードの雰囲気。',h_fx:'マウスを動かしたときの演出。2つまで重ねられます。'})[s.id]||'';
  pg.appendChild(d);
  if(s.id==='h_bg') pg.appendChild(photos());
  const plain=[], slots=new Map(), notes=[];
  for(const p of s.items){ const m=p.key.match(/^(launch|count)(\d+)_(\w+)$/);
    if(m){ const k=m[1]+m[2]; if(!slots.has(k)) slots.set(k,{n:+m[2],kind:m[1],f:{}}); slots.get(k).f[m[3]]=p; }
    else if(p.type==='text'&&!p.condition&&!plain.length) notes.push(p); else plain.push(p); }
  notes.forEach(p=>pg.insertAdjacentHTML('beforeend',`<div class="memo">${esc(p.text.replace(/^[\s　💡]+/,''))}</div>`));
  if(plain.length){ const g=document.createElement('div'); g.className='grp'; g.innerHTML=`<div class="grp-t">SETTINGS</div>`; plain.forEach(p=>{ const r=row(p); if(r) g.appendChild(r); }); pg.appendChild(g); }
  if(slots.size){ const g=document.createElement('div'); g.className='grp'; g.innerHTML=`<div class="grp-t">${s.id==='show_launch'?'SHORTCUTS':'EVENTS'}</div>`;
    const cs=document.createElement('div'); cs.className='cards'; for(const sl of slots.values()) cs.appendChild(card(sl)); g.appendChild(cs); pg.appendChild(g); }
  vis();
}
function row(p){
  const r=document.createElement('div'); r.dataset.key=p.key;
  if(p.type==='text'){ r.className='it'; r.innerHTML=`<div class="memo">${esc(p.text.replace(/^[\s　💡]+/,''))}</div>`; return r; }
  const dp=depth(p.text); r.className='it'+(dp>=2?' sub sub2':dp>=1?' sub':'');
  const desc=DESC[p.key]?`<span class="d">${esc(DESC[p.key])}</span>`:'';
  const lb=document.createElement('div'); lb.className='lb';
  lb.innerHTML=`<span class="n">${esc(clean(p.text))}${p.key in values?'<span class="ed">編集</span>':''}</span>${desc}`;
  const ct=document.createElement('div'); ct.className='ct'; ct.appendChild(ctl(p));
  const bk=document.createElement('button'); bk.className='back'+(p.key in values?' on':''); bk.textContent='戻す'; bk.title='Wallpaper Engine の設定に戻す';
  bk.onclick=()=>{ delete values[p.key]; save(); open(current); nav(); }; ct.appendChild(bk);
  r.append(lb,ct); return r;
}
function swEl(k,after){ const b=document.createElement('button'); b.className='sw'+(eff(k)?' on':'');
  b.onclick=()=>{ const v=!eff(k); set(k,v); b.classList.toggle('on',v); after&&after(); }; return b; }
function ctl(p){
  const k=p.key, v=eff(k);
  if(p.type==='bool') return swEl(k,()=>{ mark(k); if(k.startsWith('show_')) nav(); });
  if(p.type==='slider'){ const w=document.createElement('div'); w.className='rg';
    const r=document.createElement('input'); r.type='range'; r.min=p.min; r.max=p.max; r.step=p.fraction?.01:1; r.value=v;
    const n=document.createElement('input'); n.className='v'; n.value=v;
    const paint=()=>r.style.setProperty('--p',((r.value-p.min)/(p.max-p.min)*100)+'%'); paint();
    r.oninput=()=>{ n.value=r.value; paint(); set(k,+r.value); mark(k); };
    n.onchange=()=>{ const x=Math.max(p.min,Math.min(p.max,+n.value||p.min)); n.value=r.value=x; paint(); set(k,x); mark(k); };
    w.append(r,n); return w; }
  if(p.type==='combo'){
    if(p.options.length<=4&&p.options.every(o=>String(o.label).length<=12)){ const s=document.createElement('div'); s.className='tabs';
      p.options.forEach(o=>{ const b=document.createElement('button'); b.textContent=o.label; b.classList.toggle('on',String(o.value)===String(v));
        b.onclick=()=>{ set(k,o.value); s.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); mark(k); }; s.appendChild(b); }); return s; }
    const s=document.createElement('select'); const fk=isFontKey(k);
    p.options.forEach(o=>{ const op=document.createElement('option'); op.value=o.value; op.textContent=o.label; if(fk&&FONTS[o.value]) op.style.fontFamily=FONTS[o.value].css; s.appendChild(op); }); s.value=v;
    const paintSel=()=>{ if(fk) s.style.fontFamily=FONTS[s.value]?FONTS[s.value].css:''; }; paintSel();
    s.onchange=()=>{ set(k,s.value); mark(k); paintSel(); }; return s; }
  if(k==='cal_note'){ const t=document.createElement('textarea'); t.className='tx area'; t.rows=4; t.value=String(v||'').replace(/／/g,'\n');
    t.placeholder='好きな言葉やメモ（Enterで改行）'; t.oninput=()=>{ set(k,t.value); mark(k); }; return t; }
  if(k==='todo_items'){ // one row per item, add as many as you like
    const w=document.createElement('div'); w.className='todo-ed';
    const items=()=>String(eff(k)||'').split(/[\/／\n]+/).map(s=>s.trim()).filter(Boolean);
    const commit=a=>{ set(k,a.join('／')); mark(k); };
    const draw=()=>{ w.innerHTML=''; const a=items();
      a.forEach((t,i)=>{ const r=document.createElement('div'); r.className='te-row';
        r.innerHTML=`<span class="te-no">${String(i+1).padStart(2,'0')}</span>`;
        const inp=document.createElement('input'); inp.className='tx'; inp.value=t; inp.onchange=()=>{ const b=items(); if(inp.value.trim()) b[i]=inp.value.replace(/[\/／]/g,' ').trim(); else b.splice(i,1); commit(b); draw(); };
        const del=document.createElement('button'); del.className='btn'; del.textContent='削除'; del.onclick=()=>{ const b=items(); b.splice(i,1); commit(b); draw(); };
        r.append(inp,del); w.appendChild(r); });
      const r=document.createElement('div'); r.className='te-row add';
      const inp=document.createElement('input'); inp.className='tx'; inp.placeholder='やることを入力して Enter';
      const add=document.createElement('button'); add.className='btn'; add.textContent='＋ 追加';
      const go=()=>{ const t=inp.value.replace(/[\/／]/g,' ').trim(); if(!t) return; commit([...items(),t]); draw(); w.querySelector('.add .tx').focus(); };
      add.onclick=go; inp.onkeydown=e=>{ if(e.key==='Enter') go(); };
      r.innerHTML='<span class="te-no">＋</span>'; r.append(inp,add); w.appendChild(r); };
    draw(); return w; }
  if(p.type==='color'){ const c=document.createElement('input'); c.type='color'; c.className='cl'; c.value=toHex(v); c.oninput=()=>{ set(k,fromHex(c.value)); mark(k); }; return c; }
  const w=document.createElement('div'); w.className='ct';
  if(p.type==='file'){
    const t=document.createElement('input'); t.className='tx'; t.value=v||''; t.placeholder='まだ選ばれていません'; t.readOnly=true;
    const b=document.createElement('button'); b.className='btn'; b.textContent='選ぶ';
    b.onclick=async()=>{ const path=await pick(p.fileType==='video'?'video':'image'); if(path){ t.value=path; set(k,path); mark(k); } };
    w.append(t,b); return w; }
  const t=document.createElement('input'); t.className='tx'+(/_target$/.test(k)?' w':''); t.value=v??''; t.oninput=()=>{ set(k,t.value); mark(k); };
  w.appendChild(t);
  if(/^(font_text|font_num|wordsfont)_name$/.test(k)){ // suggest the fonts installed on this PC
    t.setAttribute('list','fontList'); t.placeholder='入力すると候補が出ます'; loadInstalledFonts();
    const paint=()=>{ t.style.fontFamily=/^[\p{L}\p{N}\p{M} ._+&\-]{1,64}$/u.test(t.value.trim())?`"${t.value.trim()}"`:''; }; paint(); t.addEventListener('input',paint); }
  if(/^launch\d+_target$/.test(k)){ const b=document.createElement('button'); b.className='btn'; b.textContent='フォルダ…'; b.title='フォルダを選ぶ';
    b.onclick=async()=>{ const path=await pick('folder'); if(path){ t.value=path; set(k,path); mark(k); } }; w.appendChild(b); }
  return w;
}
function card(sl){
  const c=document.createElement('div'); c.className='cd'; c.dataset.cond=(sl.f.name||sl.f.date||{}).condition||'';
  c.innerHTML=`<div class="num">${String(sl.n).padStart(2,'0')}<small>${sl.kind==='launch'?'LINK':'EVENT'}</small></div>`;
  const field=(p,ph)=>{ if(!p) return; const f=document.createElement('div'); f.className='f'; f.dataset.key=p.key; if(p.condition) f.dataset.cond=p.condition;
    const x=ctl(p); if(x.classList.contains('ct')) [...x.children].forEach(e=>f.appendChild(e)); else f.appendChild(x);
    const first=f.querySelector('input.tx'); if(first&&ph) first.placeholder=ph; c.appendChild(f); };
  if(sl.kind==='launch'){ field(sl.f.name,'名前（例: YouTube）'); field(sl.f.target,'場所（https://… / C:\\… / ダウンロード）'); field(sl.f.icon); field(sl.f.img,'アイコン画像'); }
  else { field(sl.f.name,'名前（例: 誕生日）'); field(sl.f.date,'日付（例: 12/25 や 2027/3/1）'); }
  return c;
}
function photos(){
  const p=defs.bgsample; if(!p) return document.createTextNode('');
  const g=document.createElement('div'); g.className='photos';
  p.options.forEach(o=>{ const b=document.createElement('button'); b.innerHTML=`<div class="img" style="background-image:url('/files/samples/${o.value}-thumb.jpg')"></div><span>${esc(o.label)}</span>`;
    b.classList.toggle('on',eff('bgtype')==='sample'&&eff('bgsample')===o.value);
    b.onclick=()=>{ set('bgtype','sample'); set('bgsample',o.value); open(current); toast('「'+o.label+'」にしました'); }; g.appendChild(b); });
  return g;
}
function mark(k){ document.querySelectorAll(`.it[data-key="${k}"]`).forEach(r=>{ const n=r.querySelector('.n'); if(n&&!n.querySelector('.ed')) n.insertAdjacentHTML('beforeend','<span class="ed">編集</span>'); const b=r.querySelector('.back'); if(b) b.classList.add('on'); }); vis(); }
function vis(){
  document.querySelectorAll('#page .it[data-key]').forEach(r=>{ const p=defs[r.dataset.key]; r.style.display=ok(p&&p.condition)?'':'none'; });
  document.querySelectorAll('#page .cd').forEach(c=>{ c.classList.toggle('hidden',!ok(c.dataset.cond)); c.querySelectorAll('.f[data-cond]').forEach(f=>f.style.display=ok(f.dataset.cond)?'':'none'); });
}

/* ---------------- save / pick ---------------- */
function set(k,v){ values[k]=v; save(); }
function save(){ conn('saving','保存中…'); clearTimeout(saveTimer); saveTimer=setTimeout(doSave,220); }
async function doSave(){ saveTimer=0;
  try{ const r=await fetch('/config'+iq(),{method:'POST',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify(values)}); if(!r.ok) throw 0; conn('ok','保存しました'); }
  catch(e){ conn('err','保存できません'); } }
async function flushSave(){ if(saveTimer){ clearTimeout(saveTimer); await doSave(); } }
async function pick(kind){ toast(kind==='folder'?'フォルダを選ぶ画面を開いています…':'ファイルを選ぶ画面を開いています…');
  try{ const j=await fetch('/pick?kind='+kind,{headers:H}).then(r=>r.json()); return j.path||''; }catch(e){ toast('選べませんでした'); return ''; } }

/* ---------------- search ---------------- */
$('q').addEventListener('input',()=>{
  const q=$('q').value.trim().toLowerCase(); if(!q){ open(current); return; }
  const pg=$('page'); pg.innerHTML=`<div class="p-no">SEARCH</div><div class="p-h"><h1>「${esc(q)}」</h1></div><p class="p-d">見つかった設定</p>`;
  const g=document.createElement('div'); g.className='grp'; let n=0;
  for(const s of sections) for(const p of s.items){ if(p.type==='text') continue;
    const sl=p.key.match(/^(launch|count)(\d+)_/), lbl=clean(p.text)+(DESC[p.key]||'');
    if(!(lbl+' '+s.title).toLowerCase().includes(q)) continue;
    const r=row(p); r.classList.remove('sub','sub2'); r.querySelector('.n').insertAdjacentHTML('beforeend',`<span class="ed" style="color:var(--t3);border-color:var(--rule2)">${esc(s.title)}${sl?' #'+sl[2]:''}</span>`); g.appendChild(r); if(++n>80) break; }
  pg.appendChild(n?g:Object.assign(document.createElement('div'),{className:'memo',textContent:'見つかりませんでした。別の言葉で試してみてください。'}));
});

/* ---------------- header ---------------- */
$('bExport').onclick=()=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(values,null,2)],{type:'application/json'})); a.download='widget-wallpaper-settings.json'; a.click(); toast('設定を書き出しました'); };
$('bImport').onclick=()=>$('fImport').click();
$('fImport').onchange=async e=>{ const f=e.target.files[0]; if(!f) return; try{ const j=JSON.parse(await f.text()); if(typeof j!=='object'||Array.isArray(j)) throw 0; values=j; save(); nav(); open(current); toast('設定を読み込みました'); }catch(err){ toast('読み込めませんでした'); } e.target.value=''; };
$('bClear').onclick=()=>{ if(!confirm('エディタで変えた設定をすべて消して、Wallpaper Engine の設定に戻しますか？')) return; values={}; save(); nav(); open(current); toast('元に戻しました'); };
// link to the project's GitHub page (derived from the download page URL https://USER.github.io/REPO/)
function gitLink(){ const m=String(eff('helper_url')||'').match(/^https:\/\/([\w-]+)\.github\.io\/([\w.-]+)/); const a=$('bGit');
  if(m){ a.href=`https://github.com/${m[1]}/${m[2]}`; a.style.display=''; } else a.style.display='none'; }
setTimeout(gitLink,1500);
$('bReset').onclick=()=>{ set('resetpos',true); setTimeout(()=>{ values.resetpos=false; save(); },2500); toast('ウィジェットを最初の場所に戻しました'); };

/* ---------------- preview ---------------- */
function fit(){ const s=$('scr'); $('pvFrame').style.transform=`scale(${s.clientWidth/1920})`; }
addEventListener('resize',fit);
$('pvToggle').onclick=()=>{ const on=!$('pvToggle').classList.contains('on'); $('pvToggle').classList.toggle('on',on); $('frame').style.display=on?'':'none'; $('pvFrame').src=on?pvSrc():'about:blank'; if(on) setTimeout(fit,50); };
setInterval(()=>fetch('/ping',{cache:'no-store'}).then(r=>{ if(!r.ok) throw 0; $('off').classList.remove('show'); if($('conn').classList.contains('err')) conn('ok','ヘルパー接続中'); }).catch(()=>conn('err','未接続')),4000);
load();
</script>
</body>
</html>
